name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-playwright pytest-html
          playwright install --with-deps chromium

      - name: Run Pytest
        run: |
          pytest --tracing=retain-on-failure --screenshot=only-on-failure --output=test-results --html=report.html --self-contained-html

      - name: Upload Test Report & Failure Traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-artifacts
          path: |
            report.html
            test-results/
          retention-days: 7